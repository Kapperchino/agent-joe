[package]
name = "actors"
version = "0.1.0"
edition = "2024"

[dependencies]
session = { path = "../session" }
merge-workflow = { path = "../merge-workflow" }
sandbox = { path = "../sandbox" }
worker-registry = { path = "../worker-registry" }
workspace-access = { path = "../workspace-access" }
conversation = { path = "../conversation" }
interaction = { path = "../interaction" }
response-stream = { path = "../response-stream" }
turn-engine = { path = "../turn-engine" }

uuid = { version = "1", features = ["v4"] }
tools = { path = "../tools" }
utils = { path = "../utils" }
turbo-code-macros = { path = "../turbo-code-macros" }
analysis = { path = "../analysis" }
clients = { path = "../clients" }
common-models = { path = "../common-models" }
commands = { path = "../commands" }
ractor_actors = "0.7.0"
ractor = "0.16.2"
thiserror = "2.0.18"
tracing = "0.1.44"
futures = "0.3.31"
anyhow = "1.0.102"
tokio = "1.47.1"
notify-types = "2.0.0"
itertools = "0.15.0"
flume = "0.12.0"
ra_ap_vfs = "0.0.344"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.89"

[dev-dependencies]
session = { path = "../session", features = ["test-support"] }
git2 = { version = "0.21", default-features = false }
utils = { path = "../utils", features = ["test-support"] }
