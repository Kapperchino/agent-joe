[package]
name = "workflows"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clients = { path = "../clients" }
common-models = { path = "../common-models" }
interaction = { path = "../interaction" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt"] }
tools = { path = "../tools" }
turbo-code-macros = { path = "../turbo-code-macros" }
turn-engine = { path = "../turn-engine" }
utils = { path = "../utils" }
worker-registry = { path = "../worker-registry" }
workspace-access = { path = "../workspace-access" }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }