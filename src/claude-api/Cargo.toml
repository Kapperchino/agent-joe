[package]
name = "claude-api"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
thiserror = "1.0"
url = "2.4"
uuid = { version = "1.0", features = ["v4", "serde"] } 