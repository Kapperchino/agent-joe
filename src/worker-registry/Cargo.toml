[package]
name = "worker-registry"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tools = { path = "../tools" }
turbo-code-macros = { path = "../turbo-code-macros" }
utils = { path = "../utils" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
