[package]
name = "tools"
version = "0.1.0"
edition = "2024"

[dependencies]
turbo-code-macros = { path = "../turbo-code-macros" }
analysis = { path = "../analysis" }

utils = { path = "../utils" }
anyhow = "1.0.99"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["fs", "io-util"] }
async-trait = "0.1.89"

[dev-dependencies]
ra_ap_ide = "0.0.311"
triomphe = "0.1.15"
