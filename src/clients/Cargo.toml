[package]
name = "clients"
version = "0.1.0"
edition = "2024"

[dependencies]
analysis = { path = "../analysis" }
turbo-code-macros = { path = "../turbo-code-macros" }
utils = { path = "../utils" }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
async-stream = "0.3.6"
thiserror = "2.0.17"
anyhow = "1.0.99"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["fs", "io-util"] }
text-size = "1.1.1"
