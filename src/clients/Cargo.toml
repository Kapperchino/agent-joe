[package]
name = "clients"
version = "0.1.0"
edition = "2024"

[dependencies]
analysis = { path = "../analysis" }
tools = { path = "../tools" }
utils = { path = "../utils" }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
reqwest-middleware = { version = "0.5", features = ["json"] }
reqwest-retry = "0.9"
reqwest-tracing = "0.7.1"
async-stream = "0.3.6"
thiserror = "2.0.17"
anyhow = "1.0.99"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
strum = "0.28"
strum_macros = "0.28"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
serde_urlencoded = "0.7"