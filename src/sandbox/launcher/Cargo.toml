[package]
name = "joe-sandbox-launcher"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
libkrun = "=1.18.0"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"

[profile.release]
strip = true
