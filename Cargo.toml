[package]
name = "turbo-code"
version = "0.1.0"
edition = "2024"


[dependencies]
reqwest = { version = "0.12.25", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["fs"] }
thiserror = "2.0.17"
async-stream = "0.3.6"
futures = "0.3"
ractor_actors = "0.4.9"
bytes = "1.0"
url = "2.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0.99"
ractor = "0.15"
simplelog = "^0.12.0"
log = "0.4.27"