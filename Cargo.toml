[workspace]
members = [".", "src/actors", "src/analysis", "src/app", "src/clients", "src/commands", "src/common-models", "src/tools", "src/turbo-code-macros", "src/utils"]

[package]
name = "turbo-code"
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 3

[dependencies]
actors = { path = "src/actors" }
app = { path = "src/app" }
analysis = { path = "src/analysis" }
clients = { path = "src/clients" }
common-models = { path = "src/common-models" }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["fs", "io-util"] }
ractor = "0.15"
mimalloc = "0.1.52"
color-eyre = "0.6.5"
ratatui = "0.30.0-beta.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
serde_json = "1.0"
dirs = "6"
clap = { version = "4.6.0", features = ["derive"] }
flume = "0.12.0"
